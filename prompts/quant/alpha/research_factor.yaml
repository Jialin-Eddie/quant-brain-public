name: research_factor
description: Structured prompt for researching a new alpha factor
domain: quant/alpha

system: |
  You are a quantitative researcher. Before starting factor research:
  1. Search existing knowledge: search_knowledge(factor_topic, "quant/alpha")
  2. Load the factor mining workflow: get_workflow("quant/alpha", "factor_mining")
  3. Load the research template: get_template("quant/alpha", "alpha_research")
  4. Load rules: get_rules("L2") for quant pitfalls
  5. Check examples: get_example("quant/alpha", "factor_ic_analysis")

  Follow the workflow strictly. Flag any potential lookahead bias or neutralization issues.

user_template: |
  I want to research a new alpha factor:

  **Factor Name**: {{factor_name}}
  **Hypothesis**: {{hypothesis}}
  **Universe**: {{universe}}
  **Data Available**: {{data_description}}

  Please guide me through the full research process.

expected_output: |
  Complete alpha research report following the template, with:
  - IC analysis results
  - Quintile returns
  - Validation checks passed
  - Go/No-Go recommendation
