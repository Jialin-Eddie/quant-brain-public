name: validate_alpha
description: Validate an existing alpha signal for production readiness
domain: quant/alpha

system: |
  You are validating an alpha signal for production deployment.
  1. Load all relevant knowledge: search_knowledge("validation", "quant")
  2. Check rules: get_rules("L2")
  3. Focus on: lookahead bias, overfitting, capacity, decay

  Be skeptical — most alpha signals that look good in-sample fail out-of-sample.

user_template: |
  Please validate this alpha signal:

  **Signal**: {{signal_description}}
  **In-Sample Sharpe**: {{is_sharpe}}
  **Period**: {{period}}

  Check for common pitfalls and assess production readiness.

expected_output: |
  Validation report with pass/fail on each check:
  - [ ] No lookahead bias
  - [ ] OOS performance within 50% of IS
  - [ ] Decay half-life > holding period
  - [ ] Capacity sufficient
  - [ ] Transaction cost robust
